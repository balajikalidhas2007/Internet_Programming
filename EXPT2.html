<html>

<head>
    <title>Saveetha School of Engineering</title>
    <link rel="stylesheet" href="global.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            font-family: 'Times New Roman';
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .container img {
            max-width: 500px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 3px solid #1a3d7c;
        }

        h1 {
            color: #1a3d7c;
            font-size: 32px;
            margin-top: 20px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/Saveetha.png" alt="Saveetha School of Engineering">
        <h1>Saveetha School of Engineering</h1>
    </div>
</body>

</html>
